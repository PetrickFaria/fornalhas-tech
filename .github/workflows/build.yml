name: Build Fornalhas Tech

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '7.5.1'

jobs:
  build:
    name: Compile Forge mod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Read mod version
        run: |
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          if [ -z "$MOD_VERSION" ]; then
            echo "mod_version is not set in gradle.properties" >&2
            exit 1
          fi
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"

      - name: Prepare Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compile mod and print diagnostics
        run: ./gradlew --no-daemon --stacktrace clean build

      - name: Check independent energy animation clocks
        run: |
          mkdir -p build/flow-tests
          javac -d build/flow-tests src/main/java/br/com/petrick/fornalhastech/client/EnergyFlowPhase.java tools/EnergyFlowPhaseTest.java
          java -cp build/flow-tests EnergyFlowPhaseTest

      - name: Check proportional fuel consumption
        run: |
          mkdir -p build/fuel-tests
          javac -d build/fuel-tests src/main/java/br/com/petrick/fornalhastech/blockentity/FuelWork.java tools/FuelWorkTest.java
          java -cp build/fuel-tests FuelWorkTest

      - name: Check fuel-based block light levels
        run: |
          mkdir -p build/light-tests
          javac -d build/light-tests src/main/java/br/com/petrick/fornalhastech/block/FurnaceLightLevel.java tools/FurnaceLightLevelTest.java
          java -cp build/light-tests FurnaceLightLevelTest

      - name: Validate corner geometry and fuel handoff invariants
        run: python3 tools/validate_visual_refinements_1_0_27.py

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: fornalhas-tech-${{ env.MOD_VERSION }}-${{ github.sha }}
          path: build/libs/fornalhas-tech-${{ env.MOD_VERSION }}.jar
          if-no-files-found: error
          retention-days: 30
