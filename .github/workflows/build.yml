name: Build Fornalhas Tech

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '7.5.1'

jobs:
  build:
    name: Compile Forge mod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Prepare Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compile mod and print diagnostics
        run: ./gradlew --no-daemon --stacktrace clean build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: fornalhas-tech-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
